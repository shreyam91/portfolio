name: Sync DSA

on:
  repository_dispatch:
    types:
      - dsa-updated

  schedule:
    # Daily safety-net sync
    - cron: "0 2 * * *"

jobs:
  sync-dsa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Portfolio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync DSA from GitHub
        env:
          DSA_REPO: shreyam91/Data_Structure_Algorithim
          DSA_BRANCH: dsaforge
          GITHUB_TOKEN: ${{ secrets.DSA_REPO_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node backend/scripts/syncDsaForge.js
