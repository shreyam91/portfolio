name: Sync DSA

on:
  repository_dispatch:
    types:
      - dsa-updated

  schedule:
    - cron: "0 2 * * *"

jobs:
  sync-dsa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Portfolio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Sync DSA from GitHub
        working-directory: backend
        env:
          DSA_REPO: shreyam91/Data_Structure_Algorithim
          DSA_BRANCH: dsaforge
          DSA_REPO_TOKEN: ${{ secrets.DSA_REPO_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/syncDsaForge.js